# This is a basic workflow to help you get started with MATLAB Actions
name: MATLAB Multi-Version Matrix

# Controls when the action will run. 
on: 
  workflow_dispatch:          # Allows you to run this workflow manually from the Actions tab
  schedule:
    # Runs automatically at midnight every single night
    - cron: '0 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write


env:
  PRODUCT_LIST: MATLAB MATLAB_Test MATLAB_Compiler MATLAB_Compiler_SDK Parallel_Computing_Toolbox
  MLM_LICENSE_TOKEN: ${{secrets.MLM_LICENSE_TOKEN}}

jobs:

  run-matlab-matrix:     
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        matlab-release: [R2024a,R2024b,R2025a]
      
 
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
       
      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.matlab-release }}
          cache: true
          products: ${{ env.PRODUCT_LIST }}
 
      - name: Run MATLAB Unit Tests
        uses: matlab-actions/run-tests@v3
        with:
          test-results-junit: allure-results/${{ matrix.matlab-release }}-results.xml

      - name: Create Allure Environment metadata
        if: always()
        run: |
            echo  "MATLAB_Version=${{ matrix.matlab-release }}" >> allure-results/environment.properties
            echo "Runner_OS=Ubuntu-Latest" >> allure-results/environment.properties
            echo "Trigger_Type=Manual_Dispatch" >> allure-results/environment.properties
         
      - name: Upload Version Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-report-${{ matrix.matlab-release }}
          path: allure-results/
          retention-days: 5

  generate-allure-dashboard:
    needs: run-matlab-matrix
    runs-on: ubuntu-latest
    if: always()
    steps:

      - name: check out code
        uses: actions/checkout@4
       
      - name: Download All Matrix Reports
        uses: actions/download-artifact@v4
        with:
          pattern: junit-report-*
          path: combined-results

      - name: Move reports to a single directory
        run: | 
          mkdir -p final-results/R2024a final-results/R2024b final-results/R2025a[ -f combined-results/junit-report-R2024a/R2024a-results.xml ] && cp combined-results/junit-report-R2024a/R2024a-results.xml final-results/R2024a/
          [ -f combined-results/junit-report-R2024b/R2024b-results.xml ] && cp combined-results/junit-report-R2024b/R2024b-results.xml final-results/R2024b/
          [ -f combined-results/junit-report-R2025a/R2025a-results.xml ] && cp combined-results/junit-report-R2025a/R2025a-results.xml final-results/R2025a/

      - name: Generate Centralized Allure Environment File
        run: |
          echo "Tested_MATLAB_Releases=R2024a, R2024b, R2025a" >> final-results/environment.propertiesecho "Runner_OS=Ubuntu-Latest" >> final-results/environment.propertiesecho "CI_Platform=GitHub_Actions" >> final-results/environment.properties
          

      - name: Load Allure History and Generate
        uses: simple-elf/allure-report-action@master
        with: 
          allure_results: final-results
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          



            
